sentence=ESP32-P4 DSI Display with double-buffering for LVGL
paragraph=Library for ESP32-P4 MIPI DSI displays with true double-buffering support for LVGL DIRECT rendering mode. Based on custom DPI panel driver with DMA chain manipulation for framebuffer switching. Includes the GT911 touch driver, and a text terminal (print/printf with hardware scrolling, frozen header/footer, any rotation, 720 or 480 resolution) as an alternative to LVGL. Requires chipguy_P486Panel_board for the shared I2C bus the touch controller is on. The board (Waveshare ESP32-P4-86-Panel-ETH-2RO) has 32MB flash and 32MB PSRAM; both PSRAM and Flash Size=32MB must be selected in Tools.
category=Display
url=https://github.com/chipguyhere/P486Panel_display
architectures=esp32
includes=chipguy_P486Panel_display.h
depends=chipguy_P486Panel_board
